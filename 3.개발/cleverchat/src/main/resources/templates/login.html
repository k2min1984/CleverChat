<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 로그인 | CleverChat</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Arial, "Noto Sans KR", sans-serif;
            color: #1f2937;
            background: #f3f4f6;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
        }
        main {
            width: min(420px, calc(100vw - 32px));
            background: #ffffff;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 32px;
            box-sizing: border-box;
        }
        h1 {
            margin: 0 0 24px;
            font-size: 24px;
        }
        label {
            display: block;
            margin: 16px 0 6px;
            font-weight: 700;
        }
        input {
            width: 100%;
            min-height: 44px;
            border: 1px solid #9ca3af;
            border-radius: 6px;
            padding: 8px 10px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            min-height: 44px;
            margin-top: 24px;
            border: 0;
            border-radius: 6px;
            background: #2563eb;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }
        .message {
            margin: 0 0 16px;
            padding: 12px;
            border-radius: 6px;
        }
        .error {
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }
        .logout {
            background: #ecfdf5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }
    </style>
</head>
<body>
<main>
    <h1>관리자 로그인</h1>
    <p th:if="${param.error}" class="message error" role="alert">아이디 또는 비밀번호를 확인해 주세요.</p>
    <p th:if="${param.logout}" class="message logout" role="status">로그아웃되었습니다.</p>
    <form th:action="@{/login}" method="post">
        <label for="username">아이디</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus>
        <label for="password">비밀번호</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">로그인</button>
    </form>
</main>
</body>
</html>
