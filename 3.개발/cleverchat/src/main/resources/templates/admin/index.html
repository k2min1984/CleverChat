<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admmgr/common/head :: adminHead('관리자 | CleverChat')}"></head>
<body>
<div class="admin-wrap">
    <div th:replace="~{admmgr/common/sidebar :: adminSidebar}"></div>
    <div class="admin-container">
        <div th:replace="~{admmgr/common/header :: adminHeader}"></div>
        <div th:replace="~{admmgr/common/navigation :: adminNavigation}"></div>
        <main class="admin-content">
            <header>
                <h1>CleverChat 관리자</h1>
                <nav class="actions">
                    <form th:action="@{/logout}" method="post">
                        <th:block th:replace="~{admmgr/common/_csrfHidden :: csrfHidden}"></th:block>
                        <button type="submit">로그아웃</button>
                    </form>
                </nav>
            </header>
            <section class="grid"
                     th:if="${session.CLEVERCHAT_ADMIN_SESSION != null and session.CLEVERCHAT_ADMIN_SESSION.hasAnyRole('ADMIN','OPERATOR')}">
                <article class="card">
                    <h2>인증 기반</h2>
                    <p>로그인, 세션, 감사 로그 기반이 구성되었습니다.</p>
                </article>
                <article class="card">
                    <h2>시나리오</h2>
                    <p><a th:href="@{/admin/scenarios}">시나리오 관리로 이동</a></p>
                </article>
                <article class="card">
                    <h2>운영 로그</h2>
                    <p>로그인 성공/실패 이력이 DB에 저장됩니다.</p>
                </article>
            </section>
        </main>
        <div th:replace="~{admmgr/common/footer :: adminFooter}"></div>
    </div>
</div>
</body>
</html>
