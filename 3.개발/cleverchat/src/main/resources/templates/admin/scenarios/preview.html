<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시나리오 미리보기 | CleverChat</title>
    <style>
        body { margin: 0; font-family: Arial, "Noto Sans KR", sans-serif; color: #1f2937; background: #f9fafb; }
        header { min-height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; border-bottom: 1px solid #d1d5db; background: #fff; }
        main { max-width: 760px; margin: 0 auto; padding: 28px 20px; }
        .panel { background: #fff; border: 1px solid #d1d5db; border-radius: 8px; padding: 18px; }
        .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
        .button { min-height: 36px; display: inline-flex; align-items: center; border: 1px solid #9ca3af; border-radius: 6px; background: #fff; color: #111827; padding: 0 12px; text-decoration: none; }
    </style>
</head>
<body>
<header>
    <h1>미리보기</h1>
    <a class="button" th:href="@{/admin/scenarios/{id}(id=${version.scenarioId})}">상세</a>
</header>
<main>
    <section class="panel" th:if="${current != null}">
        <h2 th:text="${current.title}">노드 제목</h2>
        <p th:text="${current.content}">본문</p>
        <div class="actions">
            <a class="button" th:each="option : ${options}" th:href="@{/admin/scenarios/versions/{versionId}/preview(versionId=${version.id},nodeId=${option.nextNodeId})}" th:text="${option.label}">옵션</a>
        </div>
    </section>
    <section class="panel" th:if="${current == null}">
        <p>미리보기 가능한 노드가 없습니다.</p>
    </section>
</main>
</body>
</html>
