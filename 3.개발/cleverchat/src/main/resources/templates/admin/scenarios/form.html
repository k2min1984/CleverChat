<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시나리오 편집 | CleverChat</title>
    <style>
        body { margin: 0; font-family: Arial, "Noto Sans KR", sans-serif; color: #1f2937; background: #f9fafb; }
        header { min-height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; border-bottom: 1px solid #d1d5db; background: #fff; }
        main { max-width: 760px; margin: 0 auto; padding: 28px 20px; }
        form { display: grid; gap: 16px; }
        label { display: grid; gap: 6px; font-weight: 700; }
        input, select, textarea { width: 100%; box-sizing: border-box; min-height: 40px; border: 1px solid #9ca3af; border-radius: 6px; padding: 8px 10px; font: inherit; }
        textarea { min-height: 140px; resize: vertical; }
        .actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .button, button { min-height: 40px; border: 1px solid #9ca3af; border-radius: 6px; background: #fff; color: #111827; padding: 0 12px; text-decoration: none; cursor: pointer; }
    </style>
</head>
<body>
<header>
    <h1>시나리오 편집</h1>
    <a class="button" th:href="@{/admin/scenarios}">목록</a>
</header>
<main>
    <form th:object="${scenarioForm}" th:action="${scenario == null} ? @{/admin/scenarios} : @{/admin/scenarios/{id}(id=${scenario.id})}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label for="categoryId">카테고리
            <select id="categoryId" th:field="*{categoryId}" aria-describedby="categoryHelp" required>
                <option value="">선택</option>
                <option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}">기본</option>
            </select>
        </label>
        <p id="categoryHelp">카테고리가 없으면 API로 먼저 생성해야 합니다.</p>
        <label for="title">제목
            <input id="title" type="text" th:field="*{title}" maxlength="150" required>
        </label>
        <label for="description">설명
            <textarea id="description" th:field="*{description}" maxlength="2000"></textarea>
        </label>
        <div class="actions">
            <button type="submit">저장</button>
            <a class="button" th:href="@{/admin/scenarios}">취소</a>
        </div>
    </form>
</main>
</body>
</html>
