<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admmgr/common/head :: adminHead('시나리오 흐름 편집 | CleverChat')}"></head>
<body>
<div class="admin-wrap">
    <div th:replace="~{admmgr/common/sidebar :: adminSidebar}"></div>
    <div class="main-area">
        <div th:replace="~{admmgr/common/header :: adminHeader}"></div>
        <div th:replace="~{admmgr/common/navigation :: adminNavigation}"></div>
        <main class="content-area"
              th:attr="data-graph-load-url=${graphLoadUrl},data-graph-save-url=${graphSaveUrl},data-back-url=${backUrl},data-preview-url=${previewUrl},data-read-only=${readOnly == true}">
            <header class="page-title-row">
                <div>
                    <h1>
                        <span th:text="${scenario.title}">시나리오</span>
                        <small th:text="'v' + ${version.versionNo} + ' (' + ${version.status} + ')'">v1 (DRAFT)</small>
                    </h1>
                    <p class="help-text">왼쪽에서 노드를 선택하고 오른쪽에서 질문, 답변, 바로가기 링크, 선택지 연결을 편집합니다.</p>
                </div>
                <nav class="actions" aria-label="시나리오 흐름 편집 작업">
                    <a class="btn btn-md btn-secondary" th:href="${backUrl}">상세</a>
                    <a class="btn btn-md btn-secondary" th:href="${previewUrl}" id="btnPreview">미리보기</a>
                    <button type="button" class="btn btn-md btn-solid btn-primary" id="btnSave" aria-describedby="graphMsg">저장</button>
                </nav>
            </header>

            <section aria-live="polite" role="status" id="graphMsg" class="msg" hidden></section>

            <section class="graph-editor-workspace" aria-label="시나리오 흐름 편집기">
                <aside class="graph-node-sidebar" aria-label="노드 목록">
                    <div class="graph-sidebar-header">
                        <div>
                            <h2>노드 목록</h2>
                            <p class="help-text">선택하면 오른쪽에서 편집합니다.</p>
                        </div>
                        <button type="button" class="btn btn-sm btn-solid btn-emerald" id="btnAddNode">추가</button>
                    </div>
                    <div class="graph-node-nav" id="nodeNav" role="list" aria-label="시나리오 노드 목록"></div>
                    <p id="nodeEmptyHelp" class="graph-empty" hidden>등록된 노드가 없습니다. 추가 버튼으로 첫 질문 노드를 만들어 주세요.</p>
                </aside>

                <section class="graph-node-editor-panel" aria-label="선택한 노드 편집">
                    <div id="nodeEditor" class="graph-node-editor"></div>
                    <p id="nodeSelectHelp" class="graph-empty">왼쪽에서 노드를 선택하거나 새 노드를 추가해 주세요.</p>
                </section>
            </section>
        </main>
        <div th:replace="~{admmgr/common/footer :: adminFooter}"></div>
    </div>
</div>
<script th:inline="javascript">
    window.CLEVERCHAT_COMMON_CODES = /*[[${adminCommonCodes}]]*/ {};
</script>
<script th:src="@{/asset/admmgr/style2/js/ADM.ScenarioGraphEdit.js(v='20260715-common-code1')}" defer></script>
</body>
</html>
