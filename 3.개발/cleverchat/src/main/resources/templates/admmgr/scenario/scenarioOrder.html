<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admmgr/common/head :: adminHead('Scenario order | CleverChat')}"></head>
<body>
<div class="admin-wrap">
    <div th:replace="~{admmgr/common/sidebar :: adminSidebar}"></div>
    <div class="main-area">
        <div th:replace="~{admmgr/common/header :: adminHeader}"></div>
        <div th:replace="~{admmgr/common/navigation :: adminNavigation}"></div>
        <main class="content-area">
            <div class="page-wrap">
                <div class="result-header">
                    <div>
                        <div class="result-count">활성 시나리오 총 <strong th:text="${#lists.size(scenarios)} + '건'">0건</strong></div>
                        <p class="list-hint">위에서 아래 순서대로 채팅 상담 주제에 노출됩니다.</p>
                    </div>
                    <div class="result-actions">
                        <a class="btn btn-sm btn-secondary" th:href="@{/admin/scenarios}">목록</a>
                        <button type="button" class="btn btn-sm btn-solid btn-primary" data-scenario-order-save>저장</button>
                    </div>
                </div>

                <div class="scenario-order-card" data-scenario-order-root th:data-save-url="@{/admin/api/scenarios/order}">
                    <div class="scenario-order-head" aria-hidden="true">
                        <span>이동</span>
                        <span>순서</span>
                        <span>시나리오명</span>
                    </div>
                    <div class="scenario-order-list" data-scenario-order-list>
                        <div class="scenario-order-item"
                             th:each="scenario, stat : ${scenarios}"
                             th:data-scenario-id="${scenario.scenarioNo}"
                             draggable="true">
                            <div class="scenario-order-handle" aria-hidden="true">
                                <span></span><span></span><span></span>
                            </div>
                            <div class="scenario-order-rank" th:text="${stat.count}">1</div>
                            <div class="scenario-order-main">
                                <strong th:text="${scenario.title}">시나리오 제목</strong>
                            </div>
                        </div>
                    </div>
                    <div th:if="${#lists.isEmpty(scenarios)}" class="td-empty scenario-order-empty">
                        정렬할 활성 시나리오가 없습니다.
                    </div>
                </div>
            </div>
        </main>
        <div th:replace="~{admmgr/common/footer :: adminFooter}"></div>
    </div>
</div>
<script th:src="@{/asset/admmgr/style2/js/ADM.ScenarioOrder.js}" defer></script>
</body>
</html>
