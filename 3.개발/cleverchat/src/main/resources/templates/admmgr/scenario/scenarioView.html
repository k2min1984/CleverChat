<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admmgr/common/head :: adminHead('Scenario detail | CleverChat')}"></head>
<body>
<div class="admin-wrap">
    <div th:replace="~{admmgr/common/sidebar :: adminSidebar}"></div>
    <div class="main-area">
        <div th:replace="~{admmgr/common/header :: adminHeader}"></div>
        <div th:replace="~{admmgr/common/navigation :: adminNavigation}"></div>
        <main class="content-area">
            <div class="page-wrap">
                <section th:if="${successMessage != null}" class="msg" role="status" aria-live="polite">
                    <p th:text="${successMessage}">저장되었습니다.</p>
                </section>
                <section th:if="${infoMessage != null}" class="msg" role="status" aria-live="polite">
                    <p th:text="${infoMessage}">안내 메시지</p>
                    <a th:if="${draftEditUrl != null}" class="btn btn-sm btn-secondary" th:href="${draftEditUrl}">초안 편집</a>
                </section>
                <section th:if="${errorMessage != null}" class="msg is-error" role="alert">
                    <p th:text="${errorMessage}">오류 메시지</p>
                </section>

                <div class="view-card">
                    <div class="view-header">
                        <div class="view-title">
                            <span th:text="${scenario.title}">시나리오 제목</span>
                            <span th:if="${scenario.status == 'ACTIVE'}" class="badge badge-success">활성</span>
                            <span th:if="${scenario.status == 'DRAFT'}" class="badge badge-info">초안</span>
                            <span th:if="${scenario.status == 'INACTIVE'}" class="badge badge-default">비활성</span>
                        </div>
                        <div class="view-meta">
                            <span>카테고리 <strong th:text="${scenario.categoryName}">민원</strong></span>
                            <span class="view-meta-sep">/</span>
                            <span>ID <strong th:text="${scenario.scenarioNo}">1</strong></span>
                            <span class="view-meta-sep">/</span>
                            <span>수정일 <strong th:text="${#temporals.format(scenario.lstChgDt, 'yyyy-MM-dd HH:mm')}">2026-05-11</strong></span>
                        </div>
                    </div>
                    <div class="view-body" th:text="${scenario.description != null and !scenario.description.isBlank() ? scenario.description : '등록된 설명이 없습니다.'}">
                        등록된 설명이 없습니다.
                    </div>
                    <div class="view-footer">
                        <a class="btn btn-md btn-secondary" th:href="@{/admin/scenarios}">목록</a>
                        <a class="btn btn-md btn-solid btn-primary" th:href="@{/admin/scenarios/{id}/edit(id=${scenario.scenarioNo})}">수정</a>
                        <form th:if="${scenario.status == 'ACTIVE'}" th:action="@{/admin/scenarios/{id}/deactivate(id=${scenario.scenarioNo})}" method="post">
                            <th:block th:replace="~{admmgr/common/_csrfHidden :: csrfHidden}"></th:block>
                            <button class="btn btn-md btn-secondary" type="submit">비활성화</button>
                        </form>
                    </div>
                </div>

                <div class="result-header">
                    <div class="result-count">버전 총 <strong th:text="${#lists.size(versions)} + '건'">0건</strong></div>
                    <div class="result-actions">
                        <form th:action="@{/admin/scenarios/{id}/versions(id=${scenario.scenarioNo})}" method="post">
                            <th:block th:replace="~{admmgr/common/_csrfHidden :: csrfHidden}"></th:block>
                            <button type="submit" class="btn btn-sm btn-solid btn-emerald">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                                새 초안
                            </button>
                        </form>
                    </div>
                </div>

                <div class="table-card">
                    <div class="table-wrap">
                        <div class="admin-table-wrap">
                            <table class="admin-table" aria-label="Scenario version list">
                                <caption>Scenario version list</caption>
                                <colgroup>
                                    <col style="width:90px">
                                    <col style="width:130px">
                                    <col style="width:120px">
                                    <col>
                                </colgroup>
                                <thead>
                                <tr>
                                    <th scope="col">버전</th>
                                    <th scope="col">상태</th>
                                    <th scope="col">시작 노드</th>
                                    <th scope="col">관리</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="version : ${versions}">
                                    <td th:text="'v' + ${version.versionNo}">v1</td>
                                    <td>
                                        <span th:if="${version.status == 'DRAFT'}" class="badge badge-info">초안</span>
                                        <span th:if="${version.status == 'PUBLISHED'}" class="badge badge-success">게시</span>
                                        <span th:if="${version.status == 'ARCHIVED'}" class="badge badge-default">보관</span>
                                    </td>
                                    <td th:text="${version.startNodeNo != null ? version.startNodeNo : '-'}">-</td>
                                    <td>
                                        <div class="row-actions">
                                            <a th:if="${version.status == 'DRAFT'}" class="btn btn-xs btn-secondary"
                                               th:href="@{/admin/scenarios/{scenarioId}/versions/{versionId}/graph(scenarioId=${scenario.scenarioNo},versionId=${version.scenarioVersionNo})}">편집</a>
                                            <a class="btn btn-xs btn-secondary"
                                               href="#"
                                               th:href="@{/admin/scenarios/versions/{id}/preview(id=${version.scenarioVersionNo})}"
                                               th:data-preview-url="@{/admin/scenarios/versions/{id}/preview(id=${version.scenarioVersionNo})}">미리보기</a>
                                            <span th:if="${version.status != 'DRAFT'}" class="help-text">게시/보관 버전은 새 초안에서 수정</span>
                                            <form th:if="${version.status == 'DRAFT'}"
                                                  th:with="publishability=${publishabilityByVersionId[version.scenarioVersionNo]}"
                                                  th:action="@{/admin/scenarios/versions/{id}/publish(id=${version.scenarioVersionNo})}" method="post">
                                                <th:block th:replace="~{admmgr/common/_csrfHidden :: csrfHidden}"></th:block>
                                                <input type="hidden" name="scenarioId" th:value="${scenario.scenarioNo}">
                                                <button class="btn btn-xs btn-solid btn-primary" type="submit"
                                                        th:disabled="${publishability == null or !publishability.publishable()}"
                                                        th:title="${publishability == null ? '게시 조건을 확인하세요.' : publishability.reason()}"
                                                        th:attr="aria-describedby=${publishability == null or !publishability.publishable() ? 'publishHelp-' + version.scenarioVersionNo : null}">게시</button>
                                                <span th:if="${publishability == null or !publishability.publishable()}"
                                                      th:id="${'publishHelp-' + version.scenarioVersionNo}"
                                                      class="help-text"
                                                      th:text="${publishability == null ? '게시 조건을 확인하세요.' : publishability.reason()}">그래프 저장 후 게시할 수 있습니다.</span>
                                            </form>
                                            <form th:if="${version.status == 'PUBLISHED' and scenario.status != 'ACTIVE'}" th:action="@{/admin/scenarios/{id}/activate(id=${scenario.scenarioNo})}" method="post">
                                                <th:block th:replace="~{admmgr/common/_csrfHidden :: csrfHidden}"></th:block>
                                                <input type="hidden" name="versionId" th:value="${version.scenarioVersionNo}">
                                                <button class="btn btn-xs btn-solid btn-emerald" type="submit">활성화</button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(versions)}" class="td-empty">
                                    <td colspan="4">등록된 버전이 없습니다.</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div class="view-card">
                    <div class="view-hist-header">
                        <strong class="view-hist-title">키워드 <span class="view-hist-cnt" th:text="${#lists.size(keywords)} + '건'">0건</span></strong>
                    </div>
                    <div class="view-body compact-body">
                        <ul class="keyword-chip-list">
                            <li th:each="keyword : ${keywords}">
                                <span class="badge badge-default" th:text="${keyword.keyword + ' (' + keyword.weight + ')'}">키워드</span>
                            </li>
                            <li th:if="${#lists.isEmpty(keywords)}" class="help-text">등록된 키워드가 없습니다.</li>
                        </ul>
                    </div>
                </div>
            </div>
        </main>
        <div th:replace="~{admmgr/common/footer :: adminFooter}"></div>
    </div>
</div>
<script th:src="@{/asset/admmgr/style2/js/ADM.ScenarioList.js}" defer></script>
</body>
</html>
