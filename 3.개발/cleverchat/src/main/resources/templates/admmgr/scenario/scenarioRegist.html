<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시나리오 편집 | CleverChat</title>
    <link rel="stylesheet" th:href="@{/asset/admmgr/style2/css/admin-layout.css}">
    <link rel="stylesheet" th:href="@{/asset/admmgr/style2/css/sub.css}">
    <script th:src="@{/asset/admmgr/style2/js/ADM.Common.js}" defer></script>
</head>
<body>
<div class="admin-wrap">
    <div th:replace="~{common/fragments :: adminSidebar}"></div>
    <div class="admin-container">
        <div th:replace="~{common/fragments :: adminHeader}"></div>
        <div th:replace="~{common/fragments :: adminNavigation}"></div>
        <main class="admin-content">
            <header>
                <h1>시나리오 편집</h1>
                <a class="button" th:href="@{/admin/scenarios}">목록</a>
            </header>
            <form th:object="${scenarioForm}" th:action="@{${formAction}}" method="post">
                <label for="categoryId">카테고리
                    <select id="categoryId" th:field="*{categoryId}" aria-describedby="categoryHelp" required>
                        <option value="">선택</option>
                        <option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}">기본</option>
                    </select>
                </label>
                <p id="categoryHelp">카테고리가 없으면 API로 먼저 생성해야 합니다.</p>
                <label for="title">제목
                    <input id="title" type="text" th:field="*{title}" maxlength="150" required>
                </label>
                <label for="description">설명
                    <textarea id="description" th:field="*{description}" maxlength="2000"></textarea>
                </label>
                <div class="actions">
                    <button type="submit">저장</button>
                    <a class="button" th:href="@{/admin/scenarios}">취소</a>
                </div>
            </form>
        </main>
        <div th:replace="~{common/fragments :: adminFooter}"></div>
    </div>
</div>
</body>
</html>
