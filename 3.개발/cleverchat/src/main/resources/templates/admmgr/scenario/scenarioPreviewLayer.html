<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시나리오 미리보기 | CleverChat</title>
</head>
<body>
<header>
    <h1>미리보기</h1>
    <a class="button" th:href="@{/admin/scenarios/{id}(id=${version.scenarioId})}">상세</a>
</header>
<main>
    <section class="panel" th:if="${current != null}">
        <h2 th:text="${current.title}">노드 제목</h2>
        <p th:text="${current.content}">본문</p>
        <div class="actions">
            <a class="button" th:each="option : ${options}" th:href="@{/admin/scenarios/versions/{versionId}/preview(versionId=${version.id},nodeId=${option.nextNodeId})}" th:text="${option.label}">옵션</a>
        </div>
    </section>
    <section class="panel" th:if="${current == null}">
        <p>미리보기 가능한 노드가 없습니다.</p>
    </section>
</main>
</body>
</html>
