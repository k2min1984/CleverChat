<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admmgr/common/head :: adminHead('검색 이력 | CleverChat')}"></head>
<body>
<div class="admin-wrap">
    <div th:replace="~{admmgr/common/sidebar :: adminSidebar}"></div>
    <div class="main-area">
        <div th:replace="~{admmgr/common/header :: adminHeader}"></div>
        <div th:replace="~{admmgr/common/navigation :: adminNavigation}"></div>
        <main class="content-area board-page" data-search-root>
            <div class="page-wrap">
                <div th:replace="~{admmgr/common/board :: heading('검색 이력', '검색어, 검색 출처와 결과를 확인합니다.')}"></div>
                <p id="searchStatus" role="status" aria-live="polite" class="help-text"></p>
                <form method="get" th:action="@{/admin/search/logs}" class="search-card search-card-horizontal" aria-label="Search log filters">
                    <div class="box-title">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                        검색 조건
                    </div>
                    <div class="search-row">
                        <div class="search-field">
                            <label for="query" class="search-label">검색어</label>
                            <input id="query" type="search" name="query" class="search-input" maxlength="200" th:value="${query}" placeholder="검색어 입력">
                        </div>
                        <div class="search-field">
                            <label for="source" class="search-label">출처</label>
                            <select id="source" name="source" class="search-select">
                                <option value="" th:selected="${source == null or source == ''}">전체</option>
                                <option th:each="code : ${adminCommonCodes['SEARCH_SOURCE']}"
                                        th:value="${code.value}" th:selected="${source == code.value}"
                                        th:text="${code.name + ' (' + code.value + ')'}">검색 출처</option>
                            </select>
                        </div>
                    </div>
                    <div class="search-actions">
                        <a class="btn-reset" th:href="@{/admin/search/logs}">초기화</a>
                        <button type="submit" class="btn-search">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                            검색
                        </button>
                    </div>
                </form>

                <div class="result-header">
                    <div class="result-count">검색 로그 조회 <strong th:text="${#lists.size(logs)} + '건'">0건</strong></div>
                </div>

                <div class="table-card">
                    <div class="table-wrap">
                        <div class="admin-table-wrap">
                            <table class="admin-table" data-board-pagination aria-label="Search log list">
                                <caption>Search log list</caption>
                                <colgroup>
                                    <col style="width:60px">
                                    <col>
                                    <col style="width:140px">
                                    <col style="width:80px">
                                    <col style="width:140px">
                                    <col style="width:90px">
                                    <col style="width:160px">
                                </colgroup>
                                <thead>
                                <tr>
                                    <th scope="col">번호</th>
                                    <th scope="col">검색어</th>
                                    <th scope="col">출처</th>
                                    <th scope="col">결과수</th>
                                    <th scope="col">매칭 시나리오</th>
                                    <th scope="col">지연</th>
                                    <th scope="col">등록일</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="log, stat : ${logs}">
                                    <td class="board-number" th:text="${stat.count}">1</td>
                                    <td class="td-left" th:text="${log.normalizedQuery}">shipping</td>
                                    <td><span class="badge badge-default" th:text="${log.source}">ADMIN_TEST</span></td>
                                    <td th:text="${log.resultCount}">1</td>
                                    <td th:text="${log.topScenarioNo ?: '-'}">10</td>
                                    <td th:text="${log.latencyMs + 'ms'}">5ms</td>
                                    <td class="board-date" th:text="${#temporals.format(log.frstRegDt, 'yyyy-MM-dd HH:mm')}">2026-05-27 13:00</td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(logs)}" class="td-empty">
                                    <td colspan="7"><span class="board-empty-message">검색 로그가 없습니다.</span></td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <div th:replace="~{admmgr/common/footer :: adminFooter}"></div>
    </div>
</div>
<script th:src="@{/asset/admmgr/style2/js/ADM.SearchOps.js}" defer></script>
</body>
</html>
