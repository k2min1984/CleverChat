<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admmgr/common/head :: adminHead('Search logs | CleverChat')}"></head>
<body>
<div class="admin-wrap">
    <div th:replace="~{admmgr/common/sidebar :: adminSidebar}"></div>
    <div class="main-area">
        <div th:replace="~{admmgr/common/header :: adminHeader}"></div>
        <div th:replace="~{admmgr/common/navigation :: adminNavigation}"></div>
        <main class="content-area" data-search-root>
            <header>
                <h1>Search logs</h1>
                <nav class="actions" aria-label="Search operations">
                    <a class="button" th:href="@{/admin/search/blocks}">Blocked</a>
                    <a class="button" th:href="@{/admin/search/popular}">Popular</a>
                </nav>
            </header>
            <form method="get" th:action="@{/admin/search/logs}" aria-label="Search log filters">
                <label>
                    Query
                    <input type="search" name="query" maxlength="200" th:value="${query}">
                </label>
                <label>
                    Source
                    <select name="source">
                        <option value="" th:selected="${source == null or source == ''}">All</option>
                        <option value="CHAT_FALLBACK" th:selected="${source == 'CHAT_FALLBACK'}">CHAT_FALLBACK</option>
                        <option value="ADMIN_TEST" th:selected="${source == 'ADMIN_TEST'}">ADMIN_TEST</option>
                        <option value="API" th:selected="${source == 'API'}">API</option>
                    </select>
                </label>
                <button type="submit">Filter</button>
            </form>
            <section aria-label="Search test" data-search-test>
                <h2>Search test</h2>
                <form id="searchTestForm">
                    <label>
                        Query
                        <input type="search" name="query" maxlength="200" required>
                    </label>
                    <label>
                        Limit
                        <input type="number" name="limit" min="1" max="20" value="5">
                    </label>
                    <button type="submit">Run test</button>
                </form>
                <p id="searchStatus" role="status" aria-live="polite"></p>
                <ol id="searchResults" role="list" aria-label="Search test results"></ol>
            </section>
            <table aria-label="Search log list">
                <caption>Search log list</caption>
                <thead>
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Query</th>
                    <th scope="col">Source</th>
                    <th scope="col">Results</th>
                    <th scope="col">Top scenario</th>
                    <th scope="col">Latency</th>
                    <th scope="col">Created</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="log : ${logs}">
                    <td th:text="${log.searchLogNo}">1</td>
                    <td th:text="${log.normalizedQuery}">shipping</td>
                    <td th:text="${log.source}">ADMIN_TEST</td>
                    <td th:text="${log.resultCount}">1</td>
                    <td th:text="${log.topScenarioNo ?: '-'}">10</td>
                    <td th:text="${log.latencyMs + 'ms'}">5ms</td>
                    <td th:text="${#temporals.format(log.frstRegDt, 'yyyy-MM-dd HH:mm')}">2026-05-27 13:00</td>
                </tr>
                <tr th:if="${#lists.isEmpty(logs)}">
                    <td colspan="7">No search logs found.</td>
                </tr>
                </tbody>
            </table>
        </main>
        <div th:replace="~{admmgr/common/footer :: adminFooter}"></div>
    </div>
</div>
<script th:src="@{/asset/admmgr/style2/js/ADM.SearchOps.js}" defer></script>
</body>
</html>
