<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admmgr/common/head :: adminHead('개인정보 차단 이력 | CleverChat')}"></head>
<body>
<div class="admin-wrap">
    <div th:replace="~{admmgr/common/sidebar :: adminSidebar}"></div>
    <div class="main-area">
        <div th:replace="~{admmgr/common/header :: adminHeader}"></div>
        <div th:replace="~{admmgr/common/navigation :: adminNavigation}"></div>
        <main class="content-area board-page">
            <div class="page-wrap">
                <div th:replace="~{admmgr/common/board :: heading('개인정보 차단 이력', '개인정보가 감지되어 차단된 검색 요청을 확인합니다.')}"></div>
                <form method="get" th:action="@{/admin/search/blocks}" class="search-card search-card-horizontal" aria-label="Search block filters">
                    <div class="box-title">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                        검색 조건
                    </div>
                    <div class="search-row">
                        <div class="search-field">
                            <label for="piiType" class="search-label">PII 유형</label>
                            <input id="piiType" type="search" name="piiType" class="search-input" maxlength="50" th:value="${piiType}" placeholder="PII 유형 입력">
                        </div>
                        <div class="search-field">
                            <label for="source" class="search-label">출처</label>
                            <select id="source" name="source" class="search-select">
                                <option value="" th:selected="${source == null or source == ''}">전체</option>
                                <option th:each="code : ${adminCommonCodes['SEARCH_SOURCE']}"
                                        th:value="${code.value}" th:selected="${source == code.value}"
                                        th:text="${code.name + ' (' + code.value + ')'}">검색 출처</option>
                            </select>
                        </div>
                    </div>
                    <div class="search-actions">
                        <a class="btn-reset" th:href="@{/admin/search/blocks}">초기화</a>
                        <button type="submit" class="btn-search">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                            검색
                        </button>
                    </div>
                </form>

                <div class="result-header">
                    <div class="result-count">차단 검색 조회 <strong th:text="${#lists.size(blocks)} + '건'">0건</strong></div>
                </div>

                <div class="table-card">
                    <div class="table-wrap">
                        <div class="admin-table-wrap">
                            <table class="admin-table" data-board-pagination aria-label="Blocked search list">
                                <caption>Blocked search list</caption>
                                <colgroup>
                                    <col style="width:60px">
                                    <col style="width:80px">
                                    <col>
                                    <col style="width:140px">
                                    <col style="width:90px">
                                    <col style="width:160px">
                                </colgroup>
                                <thead>
                                <tr>
                                    <th scope="col">번호</th>
                                    <th scope="col">길이</th>
                                    <th scope="col">PII 유형</th>
                                    <th scope="col">출처</th>
                                    <th scope="col">사용자</th>
                                    <th scope="col">등록일</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="block, stat : ${blocks}">
                                    <td class="board-number" th:text="${stat.count}">1</td>
                                    <td th:text="${block.queryLength}">12</td>
                                    <td class="td-left"><span class="badge badge-default" th:text="${block.piiTypes}">EMAIL</span></td>
                                    <td><span class="badge badge-default" th:text="${block.source}">ADMIN_TEST</span></td>
                                    <td th:text="${block.userNo ?: '-'}">10</td>
                                    <td class="board-date" th:text="${#temporals.format(block.frstRegDt, 'yyyy-MM-dd HH:mm')}">2026-05-27 13:00</td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(blocks)}" class="td-empty">
                                    <td colspan="6"><span class="board-empty-message">차단된 검색이 없습니다.</span></td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <div th:replace="~{admmgr/common/footer :: adminFooter}"></div>
    </div>
</div>
</body>
</html>
