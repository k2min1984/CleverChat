<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admmgr/common/head :: adminHead('추천 질문 | CleverChat')}"></head>
<body>
<div class="admin-wrap">
    <div th:replace="~{admmgr/common/sidebar :: adminSidebar}"></div>
    <div class="main-area">
        <div th:replace="~{admmgr/common/header :: adminHeader}"></div>
        <div th:replace="~{admmgr/common/navigation :: adminNavigation}"></div>
        <main class="content-area board-page">
            <div class="page-wrap">
                <div th:replace="~{admmgr/common/board :: heading('추천 질문', '시나리오별 추천 질문의 사용 여부와 노출 순서를 확인합니다.')}"></div>
                <form method="get" th:action="@{/admin/chat/recommendations}" class="search-card search-card-horizontal" aria-label="사용 여부 검색 조건">
                    <div class="box-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>검색 조건</div>
                    <div class="search-row"><div class="search-field">
                        <label for="enabled" class="search-label">사용 여부</label>
                        <select id="enabled" name="enabled" class="search-select">
                            <option value="" th:selected="${enabled == null}">전체</option>
                            <option value="true" th:selected="${enabled == true}">사용</option>
                            <option value="false" th:selected="${enabled == false}">미사용</option>
                        </select>
                    </div></div>
                    <div class="search-actions">
                        <a class="btn-reset" th:href="@{/admin/chat/recommendations}">초기화</a>
                        <button type="submit" class="btn-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>검색</button>
                    </div>
                </form>
                <div class="result-header">
                    <div class="result-count">추천 항목 조회 <strong th:text="${#lists.size(recommendations)} + '건'">0건</strong></div>

                </div>

                <div class="table-card">
                    <div class="table-wrap">
                        <div class="admin-table-wrap">
                            <table class="admin-table" data-board-pagination aria-label="Recommendation list">
                                <caption>Recommendation list</caption>
                                <colgroup>
                                    <col style="width:60px">
                                    <col>
                                    <col>
                                    <col style="width:100px">
                                    <col style="width:90px">
                                    <col style="width:160px">
                                </colgroup>
                                <thead>
                                <tr>
                                    <th scope="col">번호</th>
                                    <th scope="col">시나리오</th>
                                    <th scope="col">라벨</th>
                                    <th scope="col">우선순위</th>
                                    <th scope="col">사용</th>
                                    <th scope="col">수정일</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="item, stat : ${recommendations}">
                                    <td class="board-number" th:text="${stat.count}">1</td>
                                    <td class="td-left" th:text="${item.scenarioTitle}">시나리오</td>
                                    <td class="td-left" th:text="${item.label}">질문</td>
                                    <td th:text="${item.priority}">100</td>
                                    <td><span class="badge" th:classappend="${item.useYn == 'Y'} ? ' badge-success' : ' badge-default'" th:text="${item.useYn == 'Y' ? '사용' : '미사용'}">사용</span></td>
                                    <td class="board-date" th:text="${#temporals.format(item.lstChgDt, 'yyyy-MM-dd HH:mm')}">2026-05-27 13:00</td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(recommendations)}" class="td-empty">
                                    <td colspan="6"><span class="board-empty-message">등록된 추천 항목이 없습니다.</span></td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <div th:replace="~{admmgr/common/footer :: adminFooter}"></div>
    </div>
</div>
</body>
</html>
