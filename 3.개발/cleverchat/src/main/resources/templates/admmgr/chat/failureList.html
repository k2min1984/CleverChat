<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admmgr/common/head :: adminHead('실패·미응답 관리 | CleverChat')}"></head>
<body>
<div class="admin-wrap">
    <div th:replace="~{admmgr/common/sidebar :: adminSidebar}"></div>
    <div class="main-area">
        <div th:replace="~{admmgr/common/header :: adminHeader}"></div>
        <div th:replace="~{admmgr/common/navigation :: adminNavigation}"></div>
        <main class="content-area board-page" data-chat-failure-root>
            <div class="page-wrap">
                <div th:replace="~{admmgr/common/board :: heading('실패·미응답 관리', '조건에 맞는 최근 50건을 확인하고 검토 의견을 남깁니다.')}"></div>
                <p id="failureStatus" role="status" aria-live="polite" class="list-hint"></p>
                <form method="get" th:action="@{/admin/chat/failures}" class="search-card search-card-horizontal" aria-label="검토 상태 검색 조건">
                    <div class="box-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>검색 조건</div>
                    <div class="search-row"><div class="search-field">
                        <label for="reviewed" class="search-label">검토 상태</label>
                        <select id="reviewed" name="reviewed" class="search-select">
                            <option value="" th:selected="${reviewed == null}">전체</option>
                            <option value="false" th:selected="${reviewed == false}">미검토</option>
                            <option value="true" th:selected="${reviewed == true}">검토완료</option>
                        </select>
                    </div></div>
                    <div class="search-actions">
                        <a class="btn-reset" th:href="@{/admin/chat/failures}">초기화</a>
                        <button type="submit" class="btn-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>검색</button>
                    </div>
                </form>
                <div class="result-header">
                    <div class="result-count">실패/미응답 조회 <strong th:text="${#lists.size(failures)} + '건'">0건</strong></div>

                </div>

                <div class="table-card">
                    <div class="table-wrap">
                        <div class="admin-table-wrap">
                            <table class="admin-table" data-board-pagination aria-label="Chat failure queue">
                                <caption>Chat failure queue</caption>
                                <colgroup>
                                    <col style="width:60px">
                                    <col style="width:120px">
                                    <col>
                                    <col style="width:130px">
                                    <col style="width:150px">
                                    <col style="width:150px">
                                    <col style="width:90px">
                                    <col style="width:240px">
                                </colgroup>
                                <thead>
                                <tr>
                                    <th scope="col">번호</th>
                                    <th scope="col">사유</th>
                                    <th scope="col">시나리오</th>
                                    <th scope="col">세션</th>
                                    <th scope="col">상세</th>
                                    <th scope="col">등록일</th>
                                    <th scope="col">상태</th>
                                    <th scope="col">검토</th>
                                </tr>
                                </thead>
                                <tbody id="failureRows">
                                <tr th:each="failure, stat : ${failures}" th:attr="data-failure-id=${failure.chatFailureNo}">
                                    <td class="board-number" th:text="${stat.count}">1</td>
                                    <td><span class="badge badge-default" th:text="${failure.reason}">NO_MATCH</span></td>
                                    <td class="td-left" th:text="${failure.scenarioTitle}">시나리오</td>
                                    <td class="td-left" th:text="${failure.sessionKey}">abcdef12</td>
                                    <td class="td-left"><details class="board-inline-detail"><summary>상세 보기</summary><pre th:text="${failure.detail}">{}</pre></details></td>
                                    <td class="board-date" th:text="${#temporals.format(failure.frstRegDt, 'yyyy-MM-dd HH:mm')}">2026-05-27 13:00</td>
                                    <td><span class="badge" th:classappend="${failure.reviewed} ? ' badge-success' : ' badge-default'" th:text="${failure.reviewed ? '검토완료' : '대기'}">대기</span></td>
                                    <td class="td-left">
                                        <form th:if="${!failure.reviewed}" class="failure-review-form" th:attr="data-failure-id=${failure.chatFailureNo}">
                                            <label>
                                                <span class="sr-only">Review comment</span>
                                                <input type="text" name="comment" maxlength="1000" placeholder="코멘트">
                                            </label>
                                            <button type="submit" class="btn btn-xs btn-solid btn-primary">검토 완료</button>
                                        </form>
                                        <span th:if="${failure.reviewed}" th:text="${failure.reviewComment ?: '-'}">-</span>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(failures)}" class="td-empty">
                                    <td colspan="8"><span class="board-empty-message">실패 내역이 없습니다.</span></td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <div th:replace="~{admmgr/common/footer :: adminFooter}"></div>
    </div>
</div>
<script th:src="@{/asset/admmgr/style2/js/ADM.ChatFailures.js}" defer></script>
</body>
</html>
