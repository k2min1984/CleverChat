<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admmgr/common/head :: adminHead('사용자 피드백 | CleverChat')}"></head>
<body>
<div class="admin-wrap">
    <div th:replace="~{admmgr/common/sidebar :: adminSidebar}"></div>
    <div class="main-area">
        <div th:replace="~{admmgr/common/header :: adminHeader}"></div>
        <div th:replace="~{admmgr/common/navigation :: adminNavigation}"></div>
        <main class="content-area board-page">
            <div class="page-wrap">
                <div th:replace="~{admmgr/common/board :: heading('사용자 피드백', '조건에 맞는 최근 50건의 평가와 의견을 확인합니다.')}"></div>
                <form method="get" th:action="@{/admin/chat/feedback}" class="search-card search-card-horizontal" aria-label="평가 검색 조건">
                    <div class="box-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>검색 조건</div>
                    <div class="search-row"><div class="search-field">
                        <label for="rating" class="search-label">평가</label>
                        <select id="rating" name="rating" class="search-select">
                            <option value="" th:selected="${rating == null or rating == ''}">전체</option>
                            <option value="UP" th:selected="${rating == 'UP'}">좋아요</option>
                            <option value="DOWN" th:selected="${rating == 'DOWN'}">싫어요</option>
                        </select>
                    </div></div>
                    <div class="search-actions">
                        <a class="btn-reset" th:href="@{/admin/chat/feedback}">초기화</a>
                        <button type="submit" class="btn-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>검색</button>
                    </div>
                </form>
                <div class="result-header">
                    <div class="result-count">피드백 조회 <strong th:text="${#lists.size(feedbackItems)} + '건'">0건</strong></div>

                </div>

                <div class="table-card">
                    <div class="table-wrap">
                        <div class="admin-table-wrap">
                            <table class="admin-table" data-board-pagination aria-label="Chat feedback list">
                                <caption>Chat feedback list</caption>
                                <colgroup>
                                    <col style="width:60px">
                                    <col style="width:90px">
                                    <col>
                                    <col style="width:140px">
                                    <col style="width:80px">
                                    <col>
                                    <col style="width:160px">
                                </colgroup>
                                <thead>
                                <tr>
                                    <th scope="col">번호</th>
                                    <th scope="col">평가</th>
                                    <th scope="col">시나리오</th>
                                    <th scope="col">세션</th>
                                    <th scope="col">메시지</th>
                                    <th scope="col">코멘트</th>
                                    <th scope="col">등록일</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="item, stat : ${feedbackItems}">
                                    <td class="board-number" th:text="${stat.count}">1</td>
                                    <td><span class="badge" th:classappend="${item.rating == 'UP'} ? ' badge-success' : ' badge-default'" th:text="${item.rating == 'UP' ? '좋아요' : (item.rating == 'DOWN' ? '싫어요' : item.rating)}">좋아요</span></td>
                                    <td class="td-left" th:text="${item.scenarioTitle}">시나리오</td>
                                    <td class="td-left" th:text="${item.sessionKey}">abcdef12</td>
                                    <td th:text="${item.messageNo}">10</td>
                                    <td class="td-left" th:text="${item.comment ?: '-'}">-</td>
                                    <td class="board-date" th:text="${#temporals.format(item.frstRegDt, 'yyyy-MM-dd HH:mm')}">2026-05-27 13:00</td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(feedbackItems)}" class="td-empty">
                                    <td colspan="7"><span class="board-empty-message">등록된 피드백이 없습니다.</span></td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <div th:replace="~{admmgr/common/footer :: adminFooter}"></div>
    </div>
</div>
</body>
</html>
