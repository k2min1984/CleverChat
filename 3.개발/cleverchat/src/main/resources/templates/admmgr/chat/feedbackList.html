<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admmgr/common/head :: adminHead('Chat feedback | CleverChat')}"></head>
<body>
<div class="admin-wrap">
    <div th:replace="~{admmgr/common/sidebar :: adminSidebar}"></div>
    <div class="main-area">
        <div th:replace="~{admmgr/common/header :: adminHeader}"></div>
        <div th:replace="~{admmgr/common/navigation :: adminNavigation}"></div>
        <main class="content-area">
            <header>
                <h1>Chat feedback</h1>
                <nav class="actions" aria-label="Feedback filters">
                    <a class="button" th:href="@{/admin/chat/feedback}">All</a>
                    <a class="button" th:href="@{/admin/chat/feedback(rating='UP')}">Up</a>
                    <a class="button" th:href="@{/admin/chat/feedback(rating='DOWN')}">Down</a>
                </nav>
            </header>
            <table aria-label="Chat feedback list">
                <caption>Chat feedback list</caption>
                <thead>
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Rating</th>
                    <th scope="col">Scenario</th>
                    <th scope="col">Session</th>
                    <th scope="col">Message</th>
                    <th scope="col">Comment</th>
                    <th scope="col">Created</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${feedbackItems}">
                    <td th:text="${item.id}">1</td>
                    <td th:text="${item.rating}">UP</td>
                    <td th:text="${item.scenarioTitle}">Scenario</td>
                    <td th:text="${item.sessionKey}">abcdef12</td>
                    <td th:text="${item.messageId}">10</td>
                    <td th:text="${item.comment ?: '-'}">-</td>
                    <td th:text="${#temporals.format(item.createdAt, 'yyyy-MM-dd HH:mm')}">2026-05-27 13:00</td>
                </tr>
                <tr th:if="${#lists.isEmpty(feedbackItems)}">
                    <td colspan="7">No feedback found.</td>
                </tr>
                </tbody>
            </table>
        </main>
        <div th:replace="~{admmgr/common/footer :: adminFooter}"></div>
    </div>
</div>
</body>
</html>
