<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admmgr/common/head :: adminHead('대화 세션 | CleverChat')}"></head>
<body>
<div class="admin-wrap">
    <div th:replace="~{admmgr/common/sidebar :: adminSidebar}"></div>
    <div class="main-area">
        <div th:replace="~{admmgr/common/header :: adminHeader}"></div>
        <div th:replace="~{admmgr/common/navigation :: adminNavigation}"></div>
        <main class="content-area board-page">
            <div class="page-wrap">
                <div th:replace="~{admmgr/common/board :: heading('대화 세션', '최근 대화 50건의 진행 상태와 메시지 이력을 확인합니다.')}"></div>
                <div class="result-header">
                    <div class="result-count">대화 세션 조회 <strong th:text="${#lists.size(sessions)} + '건'">0건</strong></div>
                </div>

                <div class="table-card">
                    <div class="table-wrap">
                        <div class="admin-table-wrap">
                            <table class="admin-table" data-board-pagination aria-label="Chat session list">
                                <caption>Chat session list</caption>
                                <colgroup>
                                    <col style="width:60px">
                                    <col style="width:140px">
                                    <col>
                                    <col style="width:100px">
                                    <col style="width:90px">
                                    <col style="width:160px">
                                    <col style="width:90px">
                                </colgroup>
                                <thead>
                                <tr>
                                    <th scope="col">번호</th>
                                    <th scope="col">세션</th>
                                    <th scope="col">시나리오</th>
                                    <th scope="col">상태</th>
                                    <th scope="col">메시지</th>
                                    <th scope="col">최근 활동</th>
                                    <th scope="col">관리</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="sess, stat : ${sessions}">
                                    <td class="board-number" th:text="${stat.count}">1</td>
                                    <td class="td-left"><a class="board-title-link" th:href="@{/admin/chat/sessions/{id}(id=${sess.chatSessionNo})}" th:text="${sess.sessionKey}">abcdef12</a></td>
                                    <td class="td-left" th:text="${sess.scenarioTitle}">시나리오</td>
                                    <td><span class="badge" th:classappend="${sess.state == 'ACTIVE'} ? ' badge-success' : ' badge-default'" th:text="${sess.state == 'ACTIVE' ? '진행 중' : (sess.state == 'CLOSED' ? '종료' : sess.state)}">ACTIVE</span></td>
                                    <td th:text="${sess.messageCount}">2</td>
                                    <td class="board-date" th:text="${#temporals.format(sess.lastActivityAt, 'yyyy-MM-dd HH:mm')}">2026-05-27 13:00</td>
                                    <td>
                                        <div class="row-actions">
                                            <a class="btn btn-xs btn-secondary" th:href="@{/admin/chat/sessions/{id}(id=${sess.chatSessionNo})}">상세</a>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(sessions)}" class="td-empty">
                                    <td colspan="7"><span class="board-empty-message">등록된 세션이 없습니다.</span></td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <div th:replace="~{admmgr/common/footer :: adminFooter}"></div>
    </div>
</div>
</body>
</html>
