<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admmgr/common/head :: adminHead('감사 로그 | CleverChat')}"></head>
<body>
<div class="admin-wrap">
    <div th:replace="~{admmgr/common/sidebar :: adminSidebar}"></div>
    <div class="main-area">
        <div th:replace="~{admmgr/common/header :: adminHeader}"></div>
        <div th:replace="~{admmgr/common/navigation :: adminNavigation}"></div>
        <main class="content-area board-page">
            <div class="page-wrap">
                <div th:replace="~{admmgr/common/board :: heading('감사 로그', '조건에 맞는 최근 50건의 관리자 작업 이력을 확인합니다.')}"></div>
                <form method="get" th:action="@{/admin/audit-logs}" class="search-card search-card-horizontal" aria-label="Audit log filters">
                    <div class="box-title">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                        검색 조건
                    </div>
                    <div class="search-row">
                        <div class="search-field">
                            <label for="actor" class="search-label">행위자</label>
                            <input id="actor" type="search" name="actor" class="search-input" maxlength="64" th:value="${actor}" placeholder="행위자 입력">
                        </div>
                        <div class="search-field">
                            <label for="action" class="search-label">행위</label>
                            <input id="action" type="search" name="action" class="search-input" maxlength="64" th:value="${action}" placeholder="행위 입력">
                        </div>
                        <div class="search-field">
                            <label for="targetType" class="search-label">대상 유형</label>
                            <input id="targetType" type="search" name="targetType" class="search-input" maxlength="64" th:value="${targetType}" placeholder="대상 유형 입력">
                        </div>
                        <div class="search-field">
                            <label for="from" class="search-label">시작일</label>
                            <input id="from" class="search-input" type="datetime-local" name="from" th:value="${from == null ? '' : #temporals.format(from, 'yyyy-MM-dd''T''HH:mm')}">
                        </div>
                        <div class="search-field">
                            <label for="to" class="search-label">종료일</label>
                            <input id="to" class="search-input" type="datetime-local" name="to" th:value="${to == null ? '' : #temporals.format(to, 'yyyy-MM-dd''T''HH:mm')}">
                        </div>
                    </div>
                    <div class="search-actions">
                        <a class="btn-reset" th:href="@{/admin/audit-logs}">초기화</a>
                        <button type="submit" class="btn-search">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                            검색
                        </button>
                    </div>
                </form>

                <div class="result-header">
                    <div class="result-count">감사 로그 조회 <strong th:text="${#lists.size(logs)} + '건'">0건</strong></div>
                    <div class="result-actions">
                        <a class="btn btn-sm btn-secondary" th:href="@{/admin/statistics}">통계</a>
                    </div>
                </div>

                <div class="table-card">
                    <div class="table-wrap">
                        <div class="admin-table-wrap">
                            <table class="admin-table" data-board-pagination aria-label="Audit log list">
                                <caption>Audit log list</caption>
                                <colgroup>
                                    <col style="width:60px">
                                    <col style="width:140px">
                                    <col style="width:120px">
                                    <col style="width:160px">
                                    <col style="width:120px">
                                    <col>
                                    <col style="width:160px">
                                </colgroup>
                                <thead>
                                <tr>
                                    <th scope="col">번호</th>
                                    <th scope="col">행위자</th>
                                    <th scope="col">행위</th>
                                    <th scope="col">대상</th>
                                    <th scope="col">IP</th>
                                    <th scope="col">상세</th>
                                    <th scope="col">등록일</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="log, stat : ${logs}">
                                    <td class="board-number" th:text="${stat.count}">1</td>
                                    <td class="td-left" th:text="${log.actor ?: '-'}">admin</td>
                                    <td th:text="${log.action}">CREATE</td>
                                    <td class="td-left" th:text="${(log.targetType ?: '-') + ' / ' + (log.targetId ?: '-')}">SCENARIO / 10</td>
                                    <td th:text="${log.ip ?: '-'}">127.0.0.1</td>
                                    <td class="td-left"><details class="board-inline-detail" th:if="${log.detail != null}"><summary>상세 보기</summary><pre th:text="${log.detail}">{}</pre></details><span th:if="${log.detail == null}">-</span></td>
                                    <td class="board-date" th:text="${#temporals.format(log.frstRegDt, 'yyyy-MM-dd HH:mm')}">2026-05-27 13:00</td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(logs)}" class="td-empty">
                                    <td colspan="7"><span class="board-empty-message">등록된 감사 로그가 없습니다.</span></td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <div th:replace="~{admmgr/common/footer :: adminFooter}"></div>
    </div>
</div>
</body>
</html>
