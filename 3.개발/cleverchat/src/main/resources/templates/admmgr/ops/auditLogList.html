<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admmgr/common/head :: adminHead('Audit logs | CleverChat')}"></head>
<body>
<div class="admin-wrap">
    <div th:replace="~{admmgr/common/sidebar :: adminSidebar}"></div>
    <div class="main-area">
        <div th:replace="~{admmgr/common/header :: adminHeader}"></div>
        <div th:replace="~{admmgr/common/navigation :: adminNavigation}"></div>
        <main class="content-area">
            <header>
                <h1>Audit logs</h1>
                <nav class="actions" aria-label="Operations navigation">
                    <a class="button" th:href="@{/admin/statistics}">Statistics</a>
                </nav>
            </header>
            <form method="get" th:action="@{/admin/audit-logs}" aria-label="Audit log filters">
                <label>
                    Actor
                    <input type="search" name="actor" maxlength="64" th:value="${actor}">
                </label>
                <label>
                    Action
                    <input type="search" name="action" maxlength="64" th:value="${action}">
                </label>
                <label>
                    Target type
                    <input type="search" name="targetType" maxlength="64" th:value="${targetType}">
                </label>
                <label>
                    From
                    <input type="datetime-local" name="from" th:value="${from == null ? '' : #temporals.format(from, 'yyyy-MM-dd''T''HH:mm')}">
                </label>
                <label>
                    To
                    <input type="datetime-local" name="to" th:value="${to == null ? '' : #temporals.format(to, 'yyyy-MM-dd''T''HH:mm')}">
                </label>
                <button type="submit">Filter</button>
            </form>
            <table aria-label="Audit log list">
                <caption>Audit log list</caption>
                <thead>
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Actor</th>
                    <th scope="col">Action</th>
                    <th scope="col">Target</th>
                    <th scope="col">IP</th>
                    <th scope="col">Detail</th>
                    <th scope="col">Created</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="log : ${logs}">
                    <td th:text="${log.id}">1</td>
                    <td th:text="${log.actor ?: '-'}">admin</td>
                    <td th:text="${log.action}">CREATE</td>
                    <td th:text="${(log.targetType ?: '-') + ' / ' + (log.targetId ?: '-')}">SCENARIO / 10</td>
                    <td th:text="${log.ip ?: '-'}">127.0.0.1</td>
                    <td th:text="${log.detail ?: '-'}">{}</td>
                    <td th:text="${#temporals.format(log.createdAt, 'yyyy-MM-dd HH:mm')}">2026-05-27 13:00</td>
                </tr>
                <tr th:if="${#lists.isEmpty(logs)}">
                    <td colspan="7">No audit logs found.</td>
                </tr>
                </tbody>
            </table>
        </main>
        <div th:replace="~{admmgr/common/footer :: adminFooter}"></div>
    </div>
</div>
</body>
</html>
