<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admmgr/common/head :: adminHead('운영 통계 | CleverChat')}"></head>
<body>
<div class="admin-wrap">
    <div th:replace="~{admmgr/common/sidebar :: adminSidebar}"></div>
    <div class="main-area">
        <div th:replace="~{admmgr/common/header :: adminHeader}"></div>
        <div th:replace="~{admmgr/common/navigation :: adminNavigation}"></div>
        <main class="content-area board-page">
            <div class="page-wrap">
                <div th:replace="~{admmgr/common/board :: heading('운영 통계', '오늘과 최근 7일의 서비스 이용 현황을 확인합니다.')}"></div>
                <div class="result-header">
                    <div class="result-count" th:text="${'생성 시각: ' + #temporals.format(summary.generatedAt, 'yyyy-MM-dd HH:mm:ss')}">생성 시각: 2026-05-27 13:00:00</div>
                    <div class="result-actions">
                        <a class="btn btn-sm btn-secondary" th:href="@{/admin/audit-logs}">감사 로그</a>
                    </div>
                </div>

                <section class="board-metrics" aria-label="운영 통계">
                    <article class="board-metric" th:each="metric : ${summary.metrics}">
                        <h2 th:text="${{'chatSessions':'대화 세션', 'chatMessages':'대화 메시지', 'chatFailures':'응답 실패', 'chatFeedback':'사용자 피드백', 'searches':'검색 요청', 'searchPiiBlocks':'개인정보 차단', 'crawlFailures':'크롤링 실패', 'unreviewedCrawlFailures':'미검토 수집 실패', 'activeScenarios':'활성 시나리오'}[metric.key] ?: metric.label}">이용 현황</h2>
                        <div class="metric-today"><strong th:text="${#numbers.formatInteger(metric.today, 1, 'COMMA')}">0</strong><span>오늘</span></div>
                        <div class="metric-week"><span>최근 7일</span><strong th:text="${#numbers.formatInteger(metric.last7Days, 1, 'COMMA') + '건'}">0건</strong></div>
                    </article>
                </section>
            </div>
        </main>
        <div th:replace="~{admmgr/common/footer :: adminFooter}"></div>
    </div>
</div>
</body>
</html>
