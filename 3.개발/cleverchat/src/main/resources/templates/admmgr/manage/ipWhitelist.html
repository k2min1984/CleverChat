<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admmgr/common/head :: adminHead('관리자 IP 허용목록 | CleverChat')}"></head>
<body>
<div class="admin-wrap">
    <div th:replace="~{admmgr/common/sidebar :: adminSidebar}"></div>
    <div class="main-area">
        <div th:replace="~{admmgr/common/header :: adminHeader}"></div>
        <div th:replace="~{admmgr/common/navigation :: adminNavigation}"></div>
        <main class="content-area" data-admin-manage-root>
            <div class="page-wrap">
                <p role="status" aria-live="polite" class="help-text"
                   th:text="${successMessage ?: errorMessage ?: ''}"></p>

                <div class="result-header">
                    <div>
                        <h1>관리자 IP 허용목록</h1>
                        <p class="help-text" th:text="${'현재 접속 IP: ' + currentIp}">현재 접속 IP</p>
                    </div>
                </div>

                <section class="table-card">
                    <div class="box-title">허용 항목 추가</div>
                    <form method="post" th:action="@{/admin/manage/ip-whitelist}" class="search-card search-card-horizontal">
                        <th:block th:replace="~{admmgr/common/_csrfHidden :: csrfHidden}"></th:block>
                        <div class="search-row">
                            <div class="search-field">
                                <label for="newIpCidr" class="search-label">IP/CIDR</label>
                                <input id="newIpCidr" class="search-input" type="text" name="ipCidr"
                                       maxlength="64" placeholder="203.0.113.10 또는 203.0.113.0/24" required>
                            </div>
                            <div class="search-field">
                                <label for="newDescription" class="search-label">설명</label>
                                <input id="newDescription" class="search-input" type="text" name="description"
                                       maxlength="200" placeholder="관리망, VPN 대역 등">
                            </div>
                        </div>
                        <div class="search-actions">
                            <button type="submit" class="btn-search">추가</button>
                        </div>
                    </form>
                </section>

                <section class="table-card">
                    <div class="table-wrap">
                        <div class="admin-table-wrap">
                            <table class="admin-table" aria-label="관리자 IP 허용목록">
                                <caption>관리자 IP 허용목록</caption>
                                <colgroup>
                                    <col style="width:80px">
                                    <col style="width:190px">
                                    <col>
                                    <col style="width:90px">
                                    <col style="width:150px">
                                    <col style="width:150px">
                                    <col style="width:220px">
                                </colgroup>
                                <thead>
                                <tr>
                                    <th scope="col">ID</th>
                                    <th scope="col">IP/CIDR</th>
                                    <th scope="col">설명</th>
                                    <th scope="col">상태</th>
                                    <th scope="col">등록</th>
                                    <th scope="col">수정</th>
                                    <th scope="col">관리</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="entry : ${entries}">
                                    <td th:text="${entry.adminIpWhitelistNo}">1</td>
                                    <td class="td-left">
                                        <form th:id="${'ipForm' + entry.adminIpWhitelistNo}"
                                              method="post"
                                              th:action="@{/admin/manage/ip-whitelist/{id}(id=${entry.adminIpWhitelistNo})}">
                                            <th:block th:replace="~{admmgr/common/_csrfHidden :: csrfHidden}"></th:block>
                                            <input class="search-input" type="text" name="ipCidr" maxlength="64"
                                                   th:value="${entry.ipCidr}" required>
                                        </form>
                                    </td>
                                    <td class="td-left">
                                        <input class="search-input" type="text" name="description" maxlength="200"
                                               th:form="${'ipForm' + entry.adminIpWhitelistNo}"
                                               th:value="${entry.description}">
                                    </td>
                                    <td>
                                        <select class="search-select" name="useYn"
                                                th:form="${'ipForm' + entry.adminIpWhitelistNo}">
                                            <option value="Y" th:selected="${entry.useYn == 'Y'}">사용</option>
                                            <option value="N" th:selected="${entry.useYn != 'Y'}">미사용</option>
                                        </select>
                                    </td>
                                    <td th:text="${entry.frstRegDt == null ? '-' : #temporals.format(entry.frstRegDt, 'yyyy-MM-dd HH:mm')}">-</td>
                                    <td th:text="${entry.lstChgDt == null ? '-' : #temporals.format(entry.lstChgDt, 'yyyy-MM-dd HH:mm')}">-</td>
                                    <td>
                                        <div class="row-actions">
                                            <button type="submit" class="btn btn-xs btn-secondary"
                                                    th:form="${'ipForm' + entry.adminIpWhitelistNo}">저장</button>
                                            <form th:if="${entry.useYn == 'Y'}" method="post"
                                                  th:action="@{/admin/manage/ip-whitelist/{id}/disable(id=${entry.adminIpWhitelistNo})}">
                                                <th:block th:replace="~{admmgr/common/_csrfHidden :: csrfHidden}"></th:block>
                                                <button type="submit" class="btn btn-xs btn-secondary">비활성</button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(entries)}" class="td-empty">
                                    <td colspan="7">활성 허용목록이 없으면 모든 IP가 관리자 화면에 접근할 수 있습니다.</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </section>
            </div>
        </main>
        <div th:replace="~{admmgr/common/footer :: adminFooter}"></div>
    </div>
</div>
</body>
</html>
