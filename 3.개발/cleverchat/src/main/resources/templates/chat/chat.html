<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CleverChat</title>
    <link rel="stylesheet" th:href="@{/asset/chat/chat.css}">
</head>
<body>
<main class="chat-shell" data-chat-root>
    <section class="chat-panel">
        <header class="chat-header">
            <div class="brand-block">
                <span class="brand-mark" aria-hidden="true">C</span>
                <div>
                    <p class="eyebrow">CleverChat</p>
                    <h1>상담 챗봇</h1>
                </div>
            </div>
            <div class="header-actions">
                <a class="button-link secondary" th:href="@{/chat/history}">이력</a>
                <button type="button" id="newChatBtn" aria-describedby="newChatHelp">새 상담</button>
            </div>
        </header>
        <p id="newChatHelp" class="sr-only">현재 대화를 비우고 상담 주제를 다시 선택합니다.</p>

        <section class="notice-area" aria-labelledby="noticeTitle" th:if="${notices != null and !#lists.isEmpty(notices)}">
            <h2 id="noticeTitle">공지</h2>
            <ul>
                <li th:each="notice : ${notices}">
                    <strong th:text="${notice.title}">Notice title</strong>
                    <span th:text="${notice.content}">Notice content</span>
                </li>
            </ul>
        </section>

        <section class="status-line" id="statusLine" role="status" aria-live="polite">상담 주제를 불러오는 중입니다.</section>
        <section class="status-line error" id="errorLine" role="alert" hidden></section>

        <div class="chat-layout">
            <aside class="chat-sidebar" aria-label="상담 주제">
                <section class="scenario-area" aria-labelledby="scenarioTitle">
                    <div class="section-heading">
                        <h2 id="scenarioTitle">상담 주제</h2>
                        <span class="section-count" id="scenarioCount" aria-hidden="true">0</span>
                    </div>
                    <div class="scenario-list" id="scenarioList" role="list" aria-describedby="scenarioHelp"></div>
                    <p id="scenarioHelp" class="sr-only">상담 주제를 선택하면 대화가 시작됩니다.</p>
                </section>

                <section class="recommend-area" aria-labelledby="recommendTitle">
                    <div class="section-heading">
                        <h2 id="recommendTitle">추천 질문</h2>
                    </div>
                    <div class="recommend-list" id="recommendList" role="list" aria-describedby="recommendHelp"></div>
                    <p id="recommendHelp" class="sr-only">추천 질문을 선택하면 관련 상담이 시작됩니다.</p>
                </section>
            </aside>

            <section class="conversation-card" aria-label="상담 대화">
                <div class="conversation-header">
                    <div>
                        <span class="conversation-label">현재 상담</span>
                        <strong id="selectedScenarioName">주제를 선택하세요</strong>
                    </div>
                    <span class="session-state" id="sessionStateBadge">대기</span>
                </div>

                <section class="messages" id="messageList" aria-live="polite" aria-label="Conversation messages">
                    <div class="empty-state" data-empty-state>
                        <strong>상담 주제를 선택하면 대화가 시작됩니다.</strong>
                        <span>왼쪽 목록에서 테스트할 주제를 선택해 주세요.</span>
                    </div>
                </section>

                <section class="option-list" id="optionList" role="list" aria-label="Available answers"></section>

                <form class="chat-input" id="chatForm">
                    <label for="freeText">질문 입력</label>
                    <div class="input-row">
                        <input id="freeText" type="text" maxlength="500" autocomplete="off"
                               placeholder="질문을 입력하세요" aria-describedby="freeTextHelp">
                        <button type="submit">전송</button>
                    </div>
                    <p id="freeTextHelp">상담 주제를 선택한 뒤 질문을 입력할 수 있습니다.</p>
                </form>
            </section>
        </div>
    </section>
</main>
<script th:src="@{/asset/chat/chat.js}" defer></script>
</body>
</html>
