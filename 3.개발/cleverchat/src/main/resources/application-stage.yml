spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://stage-db:5432/cleverchat}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    accesslog:
      enabled: true
      directory: /var/log/cleverchat
      pattern: '%h %l %u %t "%r" %s %b %D'

logging:
  level:
    root: INFO
    kr.co.cleverchat: INFO
  file:
    name: /var/log/cleverchat/app.log
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30
      total-size-cap: 5GB
