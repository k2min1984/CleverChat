spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-init-sql: SET search_path TO ${DB_SCHEMA:cleverchat_dev}, public
  thymeleaf:
    cache: false
  flyway:
    schemas: ${DB_SCHEMA:cleverchat_dev}
    default-schema: ${DB_SCHEMA:cleverchat_dev}
    create-schemas: true
    placeholders:
      default-admin-seed-enabled: ${DEFAULT_ADMIN_SEED_ENABLED:false}

server:
  port: 8080
  servlet:
    session:
      cookie:
        secure: false   # local http

cleverchat:
  crawl:
    url-policy:
      allowed-hosts: ${CLEVERCHAT_CRAWL_ALLOWED_HOSTS:localhost,127.0.0.1}

logging:
  level:
    root: INFO
    kr.co.cleverchat: DEBUG
    org.springframework.web: INFO
    org.mybatis: DEBUG
    jdbc.sqlonly: DEBUG
