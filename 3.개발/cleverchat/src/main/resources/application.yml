spring:
  application:
    name: cleverchat
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: true
  thymeleaf:
    cache: true
    prefix: classpath:/templates/
    suffix: .html
  session:
    store-type: jdbc
    timeout: 30m
    jdbc:
      initialize-schema: never
      table-name: SPRING_SESSION
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    placeholders:
      default-admin-seed-enabled: false

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30
  mapper-locations: classpath:mapper/**/*.xml

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

server:
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: lax

logging:
  level:
    root: INFO
    kr.co.cleverchat: INFO

cleverchat:
  auth:
    max-failed-attempts: ${CLEVERCHAT_AUTH_MAX_FAILED_ATTEMPTS:5}
    lock-minutes: ${CLEVERCHAT_AUTH_LOCK_MINUTES:30}
  operator:
    seed:
      username: ${CLEVERCHAT_OPERATOR_SEED_USERNAME:}
      password: ${CLEVERCHAT_OPERATOR_SEED_PASSWORD:}
      display-name: ${CLEVERCHAT_OPERATOR_SEED_DISPLAY_NAME:Initial Operator}
      enabled: ${CLEVERCHAT_OPERATOR_SEED_ENABLED:false}
