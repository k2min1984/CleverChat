spring:
  application:
    name: cleverchat
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: true
  thymeleaf:
    cache: true
    prefix: classpath:/templates/
    suffix: .html
  session:
    store-type: jdbc
    timeout: 30m
    jdbc:
      initialize-schema: never
      table-name: SPRING_SESSION
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    placeholders:
      default-admin-seed-enabled: false

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30
  mapper-locations: classpath:mapper/**/*.xml

management:
  health:
    redis:
      enabled: ${CLEVERCHAT_REDIS_HEALTH_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

server:
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: lax

logging:
  level:
    root: INFO
    kr.co.cleverchat: INFO

cleverchat:
  ai:
    answer-suggestion:
      enabled: ${CLEVERCHAT_AI_ANSWER_SUGGESTION_ENABLED:false}
  external-api:
    enabled: ${CLEVERCHAT_EXTERNAL_API_ENABLED:false}
    api-key-sha256: ${CLEVERCHAT_EXTERNAL_API_KEY_SHA256:}
  security:
    field-encryption:
      key-base64: ${CLEVERCHAT_FIELD_ENCRYPTION_KEY_BASE64:}
      key-id: ${CLEVERCHAT_FIELD_ENCRYPTION_KEY_ID:local-v1}
      previous-keys: ${CLEVERCHAT_FIELD_ENCRYPTION_PREVIOUS_KEYS:}
  ops:
    slow-query-threshold-ms: ${CLEVERCHAT_SLOW_QUERY_THRESHOLD_MS:1000}
  notification:
    email:
      from: ${CLEVERCHAT_NOTIFICATION_EMAIL_FROM:no-reply@localhost}
  crawl:
    url-policy:
      allowed-hosts: ${CLEVERCHAT_CRAWL_ALLOWED_HOSTS:}
  chat:
    rate-limit:
      store: ${CLEVERCHAT_CHAT_RATE_LIMIT_STORE:memory}
      max-requests: ${CLEVERCHAT_CHAT_RATE_LIMIT_MAX_REQUESTS:30}
      window-seconds: ${CLEVERCHAT_CHAT_RATE_LIMIT_WINDOW_SECONDS:60}
  auth:
    max-failed-attempts: ${CLEVERCHAT_AUTH_MAX_FAILED_ATTEMPTS:5}
    lock-minutes: ${CLEVERCHAT_AUTH_LOCK_MINUTES:30}
  operator:
    seed:
      username: ${CLEVERCHAT_OPERATOR_SEED_USERNAME:}
      password: ${CLEVERCHAT_OPERATOR_SEED_PASSWORD:}
      display-name: ${CLEVERCHAT_OPERATOR_SEED_DISPLAY_NAME:Initial Operator}
      enabled: ${CLEVERCHAT_OPERATOR_SEED_ENABLED:false}
